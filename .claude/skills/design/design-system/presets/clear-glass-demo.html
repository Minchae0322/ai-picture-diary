<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clear Glass - 버튼</title>
<style>
:root{
  --bg-base:#150c2c;

  /* 채움 없음. 진짜 유리는 색이 없다 */
  --glass-a:0;

  /* 가장자리 굴절 - 유리의 두께가 빛을 꺾는 부분. 여기에만 블러를 건다 */
  --rim:8px;         /* 굴절 띠 폭. 높이의 20%를 넘기지 않는다 */
  --rim-blur:9px;
  --rim-sat:200%;    /* 카드와 버튼이 같은 값을 써야 같은 재질로 보인다 */
  --rim-bright:1.12;
  --sheen-deg:112deg;

  /* 판 전체는 거의 안 흐린다. 광학 보정만 */
  --pane-blur:.5px;
  --sat:150%;

  --edge-hi:rgb(255 255 255 / .95);
  --edge-mid:rgb(255 255 255 / .28);
  --edge-lo:rgb(255 255 255 / .06);

  --sh-contact:0 1px 2px rgb(8 3 24 / .55);
  --sh-mid:0 10px 24px -10px rgb(8 3 24 / .5);
  --sh-ambient:0 34px 70px -20px rgb(8 3 24 / .65);

  --radius:16px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;position:relative;overflow-x:hidden;
  padding:calc(40px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  font-family:'Pretendard','Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;
  background:var(--bg-base);
}

/* 유리 뒤의 대상. 선명할수록 유리가 유리로 보인다 */
.backdrop{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%}
.orb.a{width:430px;height:430px;left:-90px;top:-70px;
  background:radial-gradient(circle at 34% 30%,#818cf8,#4338ca 58%,#1e1b4b)}
.orb.b{width:330px;height:330px;right:-40px;top:12%;
  background:radial-gradient(circle at 40% 34%,#e879f9,#a21caf 58%,#4a044e)}
.orb.c{width:390px;height:390px;left:20%;bottom:-120px;
  background:radial-gradient(circle at 38% 32%,#fb7185,#be123c 58%,#4c0519)}
.orb.d{width:210px;height:210px;right:14%;bottom:8%;
  background:radial-gradient(circle at 40% 35%,#67e8f9,#0891b2 60%,#083344)}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgb(255 255 255 / .1) 1px,transparent 1px),
                   linear-gradient(90deg,rgb(255 255 255 / .1) 1px,transparent 1px);
  background-size:34px 34px}
.ghost{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  font:900 clamp(90px,17vw,200px)/1 inherit;letter-spacing:-.05em;
  color:rgb(255 255 255 / .16);white-space:nowrap}

/* ---------- 투명 유리 버튼 ---------- */
.gbtn{
  position:relative;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  /* 기본 = medium. 크기는 아래 변형이 덮어쓴다 */
  height:var(--h,40px);padding:0 var(--px,16px);
  font:var(--fw,600) var(--fs,14px)/1 inherit;letter-spacing:-.02em;color:#fff;
  border:0;border-radius:var(--radius);cursor:pointer;white-space:nowrap;

  background:rgb(255 255 255 / var(--glass-a));
  /* 판은 거의 그대로 통과시킨다. 채도만 살짝 올려 "유리를 통과한 빛" 느낌 */
  backdrop-filter:blur(var(--pane-blur)) saturate(var(--sat));
  -webkit-backdrop-filter:blur(var(--pane-blur)) saturate(var(--sat));

  /* 그림자는 바깥에만. 안쪽 채움이 없으니 inset 하이라이트는 테두리가 대신한다 */
  box-shadow:var(--sh-contact),var(--sh-mid),var(--sh-ambient);
  /* 유리 너머로 글자가 떠 있으므로 그림자로 붙잡는다 */
  text-shadow:0 1px 3px rgb(8 3 24 / .7),0 0 12px rgb(8 3 24 / .4);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
}

/* (1) 가장자리 굴절 - 테두리 안쪽 띠에서만 배경이 꺾인다. 유리의 "두께" */
.gbtn::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:var(--rim);
  backdrop-filter:blur(var(--rim-blur)) saturate(var(--rim-sat)) brightness(var(--rim-bright));
  -webkit-backdrop-filter:blur(var(--rim-blur)) saturate(var(--rim-sat)) brightness(var(--rim-bright));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;z-index:-1;
}

/* (2) 모서리 빛 + 정반사. 채움이 0이라 형태는 전부 이 한 겹이 만든다 */
.gbtn::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  /* 테두리 링 */
  padding:1px;
  background:
    linear-gradient(145deg,var(--edge-hi) 0%,var(--edge-mid) 30%,
                    var(--edge-lo) 50%,var(--edge-mid) 78%,var(--edge-hi) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
/* (3) 윗면 정반사 스윕 - 별도 레이어 */
.gbtn > .sheen{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(var(--sheen-deg),rgb(255 255 255 / .28) 0%,
                             rgb(255 255 255 / .06) 22%,transparent 42%);
  transition:opacity .22s var(--ease);
}

.gbtn:hover{transform:translateY(-2px);
  box-shadow:var(--sh-contact),0 14px 30px -10px rgb(8 3 24 / .55),
             0 44px 88px -22px rgb(8 3 24 / .8)}
.gbtn:hover > .sheen{opacity:.6}
.gbtn:active{transform:translateY(0) scale(.985);box-shadow:var(--sh-contact)}
.gbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* 크기 체계 - 이름은 TDS(small/medium/large/xlarge)를 따른다 */
.gbtn--sm{--h:32px;--px:12px;--fs:13px;--radius:10px;--rim:6px}
.gbtn--md{--h:40px;--px:16px;--fs:14px;--radius:12px;--rim:8px}
.gbtn--lg{--h:48px;--px:20px;--fs:15px;--radius:14px;--rim:10px}
.gbtn--xl{--h:56px;--px:24px;--fs:16px;--radius:16px;--rim:11px}

/* 폭 - TDS display: inline | block | full */
.gbtn--block{display:flex;width:100%}
.gbtn--full{display:flex;width:100%}

/* 터치 타깃 - 32/40은 시각 높이가 44 미만이므로 히트 영역을 넓힌다 */
/* 터치 타깃 - sm(32)/md(40)은 44 미만이라 히트 영역을 따로 넓힌다 */
.gbtn--sm .hit,.gbtn--md .hit{position:absolute;left:0;right:0;
  top:50%;transform:translateY(-50%);height:44px;border-radius:inherit}
/* 색유리 - 채움 대신 아주 옅은 색조만 */
.gbtn--accent{background:linear-gradient(135deg,rgb(196 181 253 / .10),rgb(244 114 182 / .07))}

.gbtn--solid{background:#fff;color:#150c2c;text-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:var(--sh-contact),var(--sh-mid),var(--sh-ambient),inset 0 -1px 0 rgb(21 12 44 / .12)}
.gbtn--solid::before{display:none}
.gbtn--solid::after{background:linear-gradient(145deg,rgb(255 255 255 / .9),rgb(21 12 44 / .12))}
.gbtn--solid > .sheen{display:none}
.gbtn--solid:hover{background:#f5f2ff}
.gbtn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--sh-contact)}

/* ---------- 카드 ---------- */
.card{width:min(430px,100%);padding:28px;border-radius:26px;position:relative;isolation:isolate;
  --rim:20px;
  background:rgb(255 255 255 / var(--glass-a));
  backdrop-filter:blur(var(--pane-blur)) saturate(var(--sat));
  -webkit-backdrop-filter:blur(var(--pane-blur)) saturate(var(--sat));
  box-shadow:var(--sh-contact),var(--sh-mid),var(--sh-ambient)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:var(--rim);
  backdrop-filter:blur(var(--rim-blur)) saturate(var(--rim-sat)) brightness(var(--rim-bright));
  -webkit-backdrop-filter:blur(var(--rim-blur)) saturate(var(--rim-sat)) brightness(var(--rim-bright));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(145deg,var(--edge-hi),var(--edge-mid) 30%,var(--edge-lo) 50%,
                             var(--edge-mid) 78%,var(--edge-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.card > .sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(var(--sheen-deg),rgb(255 255 255 / .28) 0%,
    rgb(255 255 255 / .06) 22%,transparent 42%)}
.card h2{margin:0 0 10px;font-size:22px;letter-spacing:-.02em;
  text-shadow:0 1px 4px rgb(8 3 24 / .75),0 0 16px rgb(8 3 24 / .45)}
.card p{margin:0 0 22px;font-size:14px;line-height:1.65;color:#fff;
  text-shadow:0 1px 4px rgb(8 3 24 / .8),0 0 14px rgb(8 3 24 / .5)}
.card .row{display:flex;gap:10px;flex-wrap:wrap}

/* 유리 안의 유리는 backdrop-filter가 부모의 결과를 한 번 더 필터해서
   같은 값을 줘도 더 탁해진다. 안쪽은 굴절을 끄고 옅은 채움으로 대신한다 */
.card .gbtn:not(.gbtn--solid){
  backdrop-filter:none;-webkit-backdrop-filter:none;
  background:rgb(255 255 255 / .10);
}
.card .gbtn::before{display:none}

.stack{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;
  margin-bottom:12px;text-align:center;text-shadow:0 1px 3px rgb(8 3 24 / .7)}
section{width:min(560px,100%)}

.tuner{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;
  display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;
  background:rgb(8 3 24 / .6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgb(255 255 255 / .2);font-size:11px;min-width:200px}
.tuner label{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tuner input{width:96px;accent-color:#fff}
.tuner b{font-variant-numeric:tabular-nums;font-weight:600;min-width:38px;text-align:right}

@media (prefers-reduced-transparency:reduce){
  .gbtn,.card{background:#2a1d52}
  .gbtn::before,.card::before{display:none}
  .gbtn,.card{text-shadow:none}}
@supports not (backdrop-filter:blur(1px)){
  .gbtn,.card{background:rgb(42 29 82 / .85)}}
@media (prefers-reduced-motion:reduce){.gbtn{transition:none}.gbtn:hover{transform:none}}
</style>
</head>
<body>

<div class="backdrop">
  <div class="grid"></div>
  <div class="orb a"></div><div class="orb b"></div>
  <div class="orb c"></div><div class="orb d"></div>
  <div class="ghost">GLASS</div>
</div>

<section>
  <div class="label">크기 - small 32 / medium 40 / large 48 / xlarge 56</div>
  <div class="stack">
    <button class="gbtn gbtn--sm"><span class="sheen"></span><span class="hit"></span>Small</button>
    <button class="gbtn gbtn--md"><span class="sheen"></span><span class="hit"></span>Medium</button>
    <button class="gbtn gbtn--lg"><span class="sheen"></span>Large</button>
    <button class="gbtn gbtn--xl"><span class="sheen"></span>XLarge</button>
  </div>
</section>

<section>
  <div class="label">변형 - fill(솔리드) / weak(유리) / 색유리 / 비활성</div>
  <div class="stack">
    <button class="gbtn gbtn--lg gbtn--solid">Fill</button>
    <button class="gbtn gbtn--lg"><span class="sheen"></span>Weak</button>
    <button class="gbtn gbtn--lg gbtn--accent"><span class="sheen"></span>색유리</button>
    <button class="gbtn gbtn--lg" disabled><span class="sheen"></span>Disabled</button>
  </div>
</section>

<section style="max-width:360px">
  <div class="label">폭 - full (앱 하단 CTA)</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="gbtn gbtn--xl gbtn--full gbtn--solid">지금 시작하기</button>
    <button class="gbtn gbtn--lg gbtn--full"><span class="sheen"></span>나중에 할게요</button>
  </div>
</section>

<section>
  <div class="label">나란히 - 같은 재질로 보이는지</div>
  <div class="stack" style="align-items:stretch">
    <div class="card" style="width:200px;padding:18px;border-radius:16px;--rim:8px">
      <span class="sheen"></span>
      <div style="font:600 14px/1.5 inherit;text-shadow:0 1px 4px rgb(8 3 24 / .75)">글 상자</div>
    </div>
    <button class="gbtn gbtn--lg" style="height:auto;align-self:stretch;padding:0 28px">
      <span class="sheen"></span>버튼</button>
  </div>
</section>

<div class="card">
  <span class="sheen"></span>
  <h2>Clear Glass</h2>
  <p>판 전체를 흐리지 않습니다. 가장자리 띠에서만 배경이 꺾이고, 가운데는 그대로 통과합니다. 굴절 폭은 버튼 크기에 비례합니다.</p>
  <div class="row">
    <button class="gbtn gbtn--md gbtn--solid"><span class="hit"></span>확인</button>
    <button class="gbtn gbtn--md"><span class="sheen"></span><span class="hit"></span>취소</button>
  </div>
</div>

<div class="tuner">
  <label>채움 <input type="range" id="a" min="0" max="20" value="0"><b id="av">.00</b></label>
  <label>굴절 폭 <input type="range" id="r" min="0" max="40" value="14"><b id="rv">14px</b></label>
  <label>굴절 세기 <input type="range" id="rb" min="0" max="24" value="9"><b id="rbv">9px</b></label>
  <label>판 블러 <input type="range" id="p" min="0" max="60" value="5"><b id="pv">0.5px</b></label>
</div>

<script>
const r=document.documentElement;
const bind=(id,out,fn)=>{const el=document.getElementById(id),o=document.getElementById(out);
  const go=()=>{const v=fn(+el.value);r.style.setProperty(v[0],v[1]);o.textContent=v[2];};
  el.addEventListener('input',go);go();};
bind('a','av',v=>['--glass-a',(v/100).toString(),'.'+String(v).padStart(2,'0')]);
bind('r','rv',v=>['--rim',v+'px',v+'px']);
bind('rb','rbv',v=>['--rim-blur',v+'px',v+'px']);
bind('p','pv',v=>['--pane-blur',(v/10)+'px',(v/10)+'px']);
</script>
</body>
</html>
